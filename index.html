<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1b18">
<title>Aprobaciones</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono-192.png">
<style>
:root{--papel:#f4f1ea;--hoja:#fffdf8;--tinta:#1d1b18;--gris:#6b655b;--linea:#d9d3c7;
  --apr:#15803d;--rev:#a16207;--des:#b91c1c;--acento:#c2410c}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--papel);color:var(--tinta);-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--tinta);color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));
  display:flex;gap:10px;align-items:center;border-bottom:6px solid var(--acento)}
header h1{font-size:17px;margin:0;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .atras,header .aj{background:none;border:0;color:#fff;font-size:22px;padding:4px 8px;min-height:40px}
main{padding:12px 12px 120px;max-width:760px;margin:0 auto}
.estado{font-size:13px;color:var(--gris);margin:2px 2px 10px}
.estado.err{color:var(--des)}
.tarjeta{display:block;width:100%;text-align:left;background:var(--hoja);border:1px solid var(--linea);border-radius:12px;padding:13px;margin-bottom:8px}
.tarjeta .t{font-weight:700}
.tarjeta .s{font-size:13px;color:var(--gris);margin-top:3px}
.barra{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#ebe6dc;margin-top:8px}
.barra i{display:block;height:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--hoja);border:1px solid var(--linea);border-radius:999px;padding:7px 12px;font-size:14px;min-height:38px}
.chip.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.buscar{width:100%;background:var(--hoja);border:1px solid var(--linea);border-radius:10px;padding:10px 12px;min-height:44px;margin-bottom:10px}
h2.grupo{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--acento);margin:18px 2px 6px;
  display:flex;justify-content:space-between;align-items:center;gap:8px}
h2.grupo button{font-size:12px;letter-spacing:0;text-transform:none;font-weight:600;background:var(--hoja);border:1px solid var(--linea);border-radius:8px;padding:6px 9px;color:var(--apr)}
.item{background:var(--hoja);border:1px solid var(--linea);border-left:6px solid var(--linea);border-radius:12px;padding:11px 12px;margin-bottom:7px}
.item.aprobado{border-left-color:var(--apr)} .item.revisar{border-left-color:var(--rev)} .item.descartado{border-left-color:var(--des)}
.item.descartado .ti{color:var(--gris);text-decoration:line-through}
.item .cab{display:flex;gap:8px;align-items:flex-start}
.item .num{flex:none;font-size:13px;color:var(--gris);min-width:26px;padding-top:1px}
.item .ti{font-weight:600;flex:1}
.item .val{flex:none;font-size:14px;font-weight:600;white-space:nowrap}
.item .de{font-size:14px;color:var(--gris);margin:5px 0 0 34px;white-space:pre-wrap}
.item .de.corto{max-height:3.9em;overflow:hidden}
.item .mas{background:none;border:0;color:var(--acento);font-size:13px;padding:2px 0 0 34px}
.botones{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:9px 0 0 34px}
.botones button{border:1px solid var(--linea);background:var(--hoja);border-radius:9px;min-height:42px;font-size:14px;font-weight:600}
.botones .a{color:var(--apr)} .botones .r{color:var(--rev)} .botones .d{color:var(--des)}
.botones .a.on{background:var(--apr);color:#fff;border-color:var(--apr)}
.botones .r.on{background:var(--rev);color:#fff;border-color:var(--rev)}
.botones .d.on{background:var(--des);color:#fff;border-color:var(--des)}
.nota{margin:7px 0 0 34px}
.nota textarea{width:100%;min-height:58px;background:#fff;border:1px solid var(--linea);border-radius:9px;padding:8px 10px;resize:vertical}
.pie{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--hoja);border-top:1px solid var(--linea);padding:9px 12px;
  padding-bottom:calc(9px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center}
.pie .cuenta{flex:1;font-size:13px;line-height:1.35}
.pie .cuenta b.a{color:var(--apr)} .pie .cuenta b.r{color:var(--rev)} .pie .cuenta b.d{color:var(--des)}
.btn{background:var(--tinta);color:#fff;border:0;border-radius:10px;padding:10px 14px;min-height:44px;font-weight:600}
.btn.sec{background:var(--hoja);color:var(--tinta);border:1px solid var(--linea)}
.vacio{text-align:center;color:var(--gris);padding:40px 16px}
.aviso{background:#fef3c7;border:1px solid #f1d58a;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.desc{font-size:14px;color:var(--gris);margin:0 2px 10px;white-space:pre-wrap}
label.et{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--gris);margin:16px 2px 5px}
input.campo{width:100%;background:var(--hoja);border:1px solid var(--linea);border-radius:10px;padding:11px 12px;min-height:46px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
</style>
</head>
<body>
<header><button class="atras" id="atras" hidden>‹</button><h1 id="titulo">Aprobaciones</h1><button class="aj" id="aj" title="Ajustes">⚙</button></header>
<main id="main"></main>
<div class="pie" id="pie" hidden></div>
<div id="toast"></div>
<script>
'use strict';
const VERSION='1.0';
const GH={dueno:'handeress',repo:'Bitacora-datos',carpeta:'aprobaciones'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ahora=()=>new Date().toISOString();
const EST={aprobado:'Aprobado',revisar:'Revisar',descartado:'Descartado'};
const S={vista:'inicio',lista:null,filtro:'todas',q:'',abiertos:{}};
let listas=[], resp={}, token='', estado='', ocupado=false, pendientes=new Set(), tSub;
const demo=new URLSearchParams(location.search).has('demo');

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200);}
function fecha(iso){if(!iso)return'';const d=new Date(iso);return d.toLocaleDateString('es-CO',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});}
function guardarLocal(){try{localStorage.setItem('apr_listas',JSON.stringify(listas));localStorage.setItem('apr_resp',JSON.stringify(resp));localStorage.setItem('apr_pend',JSON.stringify([...pendientes]));}catch(e){}}
function cargarLocal(){try{listas=JSON.parse(localStorage.getItem('apr_listas')||'[]');resp=JSON.parse(localStorage.getItem('apr_resp')||'{}');pendientes=new Set(JSON.parse(localStorage.getItem('apr_pend')||'[]'));token=localStorage.getItem('apr_token')||'';}catch(e){}}

/* La llave: la misma de la app Bitácora (mismo sitio handeress.github.io), o una pegada en Ajustes. */
function llaveBitacora(){return new Promise(res=>{try{const r=indexedDB.open('bitacora');
  r.onupgradeneeded=()=>{try{r.transaction.abort();}catch(e){} res('');};
  r.onerror=()=>res('');
  r.onsuccess=()=>{const db=r.result;try{if(!db.objectStoreNames.contains('meta')){db.close();return res('');}
    const g=db.transaction('meta').objectStore('meta').get('token');g.onsuccess=()=>{db.close();res((g.result&&g.result.v)||'');};g.onerror=()=>{db.close();res('');};}catch(e){db.close();res('');}};
  }catch(e){res('');}});}

function b64txt(str){const b=new TextEncoder().encode(str);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}
function txtB64(b){const s=atob(b.replace(/\n/g,''));const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new TextDecoder().decode(u);}
function gh(ruta,opt){opt=opt||{};return fetch('https://api.github.com/repos/'+GH.dueno+'/'+GH.repo+'/contents/'+ruta.split('/').map(encodeURIComponent).join('/'),
  {method:opt.method||'GET',body:opt.body,cache:'no-store',headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});}
function falla(r){if(r.status===401)return'la llave no sirve o venció';if(r.status===403||r.status===404)return'la llave no tiene permiso sobre '+GH.repo;return'GitHub respondió '+r.status;}
async function leerJSON(ruta){const r=await gh(ruta);if(r.status===404)return{datos:null,sha:undefined};if(!r.ok)throw new Error(falla(r));const j=await r.json();return{datos:JSON.parse(txtB64(j.content)),sha:j.sha};}

async function sincronizar(){
  if(demo||ocupado)return; if(!token){estado='Sin llave. Abre la Bitácora una vez en este navegador o pega la llave en Ajustes.';pintar();return;}
  if(!navigator.onLine){estado='Sin señal: los cambios quedan guardados en el celular.';pintar();return;}
  ocupado=true;estado='Sincronizando…';pintarEstado();
  try{
    const r=await gh(GH.carpeta+'/listas');
    if(r.status===404){listas=[];}
    else{ if(!r.ok)throw new Error(falla(r)); const arch=(await r.json()).filter(f=>f.name.endsWith('.json'));
      const nuevas=[]; for(const f of arch){const{datos}=await leerJSON(GH.carpeta+'/listas/'+f.name); if(datos&&datos.id&&Array.isArray(datos.items))nuevas.push(datos);}
      listas=nuevas; }
    for(const l of listas){
      const ruta=GH.carpeta+'/respuestas/'+l.id+'.json'; const rem=await leerJSON(ruta); const loc=resp[l.id]||{items:{}};
      const m={lista:l.id,items:Object.assign({},(rem.datos||{}).items||{}),terminada:(rem.datos||{}).terminada||false,actualizado:(rem.datos||{}).actualizado||''};
      for(const[k,v]of Object.entries(loc.items||{})) if(!m.items[k]||(v.fecha||'')>(m.items[k].fecha||''))m.items[k]=v;
      if((loc.actualizado||'')>(m.actualizado||''))m.terminada=!!loc.terminada;
      resp[l.id]=m;
      if(pendientes.has(l.id)){ m.actualizado=ahora(); m.titulo=l.titulo; m.version=VERSION;
        const body=JSON.stringify({message:'Aprobaciones: '+l.titulo,content:b64txt(JSON.stringify(m,null,1)),sha:rem.sha});
        const p=await gh(ruta,{method:'PUT',body}); if(!p.ok)throw new Error(falla(p)); pendientes.delete(l.id); }
    }
    estado='Al día · '+fecha(ahora()); guardarLocal();
  }catch(e){estado='No se pudo sincronizar: '+e.message+'. Los cambios siguen guardados en el celular.';}
  ocupado=false; pintar();
}
function programar(id){pendientes.add(id);guardarLocal();clearTimeout(tSub);tSub=setTimeout(sincronizar,2500);}

function marcar(lid,iid,est){const R=resp[lid]=resp[lid]||{lista:lid,items:{}};const it=R.items[iid]||{};
  const nuevo=it.estado===est?'':est; R.items[iid]={estado:nuevo,nota:it.nota||'',fecha:ahora()}; programar(lid); pintar();}
function nota(lid,iid,txt){const R=resp[lid]=resp[lid]||{lista:lid,items:{}};const it=R.items[iid]||{estado:''};R.items[iid]={estado:it.estado,nota:txt,fecha:ahora()};programar(lid);pintarPie();}
function cuenta(l){const R=(resp[l.id]||{}).items||{};const c={aprobado:0,revisar:0,descartado:0,sin:0};for(const it of l.items){const e=(R[it.id]||{}).estado;if(c[e]!==undefined)c[e]++;else c.sin++;}return c;}
function barra(c,n){const p=k=>(100*c[k]/Math.max(n,1)).toFixed(1)+'%';return`<div class="barra"><i style="width:${p('aprobado')};background:var(--apr)"></i><i style="width:${p('revisar')};background:var(--rev)"></i><i style="width:${p('descartado')};background:var(--des)"></i></div>`;}
function formatoValor(v){if(v===undefined||v===null||v==='')return'';if(typeof v==='number')return'$ '+Math.round(v).toLocaleString('es-CO');return esc(v);}

function pintarEstado(){const e=$('#est');if(e){e.textContent=estado;e.className='estado'+(/No se pudo|Sin llave/.test(estado)?' err':'');}}
function pintar(){
  const m=$('#main'); $('#atras').hidden=S.vista==='inicio'; $('#pie').hidden=S.vista!=='lista';
  if(S.vista==='ajustes')return pintarAjustes();
  if(S.vista==='lista'){const l=listas.find(x=>x.id===S.lista); if(!l){S.vista='inicio';return pintar();} return pintarLista(l);}
  $('#titulo').textContent='Aprobaciones';
  const act=listas.filter(l=>!(resp[l.id]||{}).terminada), ter=listas.filter(l=>(resp[l.id]||{}).terminada);
  const fila=l=>{const c=cuenta(l),n=l.items.length;return`<button class="tarjeta" data-l="${esc(l.id)}"><div class="t">${esc(l.titulo)}</div>
    <div class="s">${esc(l.proyecto||'')}${l.proyecto?' · ':''}${n} ítems · ${c.sin} sin marcar · ${c.aprobado} aprobados · ${c.revisar} a revisar · ${c.descartado} descartados</div>${barra(c,n)}</button>`;};
  m.innerHTML=`<div class="estado" id="est"></div>`+(listas.length?'':`<div class="vacio">No hay listas todavía.<br>Pídele a Claude en el chat que te arme una lista de aprobación.</div>`)
    +act.map(fila).join('')+(ter.length?`<h2 class="grupo">Terminadas</h2>`+ter.map(fila).join(''):'');
  m.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{S.vista='lista';S.lista=b.dataset.l;S.filtro='todas';S.q='';window.scrollTo(0,0);pintar();});
  pintarEstado();
}
function pintarLista(l){
  $('#titulo').textContent=l.titulo; const R=(resp[l.id]||{}).items||{}; const c=cuenta(l);
  const q=S.q.trim().toLowerCase();
  const vis=l.items.map((it,i)=>({it,i})).filter(({it})=>{const e=(R[it.id]||{}).estado||'';
    if(S.filtro==='sin'&&e)return false; if(['aprobado','revisar','descartado'].includes(S.filtro)&&e!==S.filtro)return false;
    if(q&&!((it.titulo||'')+' '+(it.detalle||'')+' '+(it.grupo||'')).toLowerCase().includes(q))return false; return true;});
  const grupos=[]; for(const x of vis){const g=x.it.grupo||'';let G=grupos.find(y=>y.g===g);if(!G)grupos.push(G={g,v:[]});G.v.push(x);}
  const chip=(k,t,n)=>`<button class="chip${S.filtro===k?' on':''}" data-f="${k}">${t} ${n}</button>`;
  let h=`<div class="estado" id="est"></div>`+(l.descripcion?`<div class="desc">${esc(l.descripcion)}</div>`:'')
   +`<div class="chips">${chip('todas','Todas',l.items.length)}${chip('sin','Sin marcar',c.sin)}${chip('aprobado','Aprobados',c.aprobado)}${chip('revisar','Revisar',c.revisar)}${chip('descartado','Descartados',c.descartado)}</div>`
   +`<input class="buscar" id="q" type="search" placeholder="Buscar en la lista" value="${esc(S.q)}">`;
  if(!vis.length)h+=`<div class="vacio">Nada con este filtro.</div>`;
  for(const G of grupos){
    if(G.g)h+=`<h2 class="grupo"><span>${esc(G.g)}</span><button data-ga="${esc(G.g)}">✓ Aprobar sin marcar</button></h2>`;
    for(const{it,i}of G.v){const r=R[it.id]||{};const e=r.estado||'';const largo=(it.detalle||'').length>140;const ab=S.abiertos[it.id];
      const verNota=e==='revisar'||e==='descartado'||r.nota||S.abiertos['n'+it.id];
      h+=`<div class="item ${e}"><div class="cab"><span class="num">${i+1}</span><span class="ti">${esc(it.titulo)}</span>${it.valor!==undefined?`<span class="val">${formatoValor(it.valor)}</span>`:''}</div>`
       +(it.detalle?`<div class="de${largo&&!ab?' corto':''}">${esc(it.detalle)}</div>`+(largo?`<button class="mas" data-ab="${esc(it.id)}">${ab?'Ver menos':'Ver todo'}</button>`:''):'')
       +`<div class="botones"><button class="a${e==='aprobado'?' on':''}" data-m="aprobado" data-i="${esc(it.id)}">✓ Aprobar</button><button class="r${e==='revisar'?' on':''}" data-m="revisar" data-i="${esc(it.id)}">↻ Revisar</button><button class="d${e==='descartado'?' on':''}" data-m="descartado" data-i="${esc(it.id)}">✕ Descartar</button></div>`
       +(verNota?`<div class="nota"><textarea data-n="${esc(it.id)}" placeholder="${e==='revisar'?'¿Qué hay que revisar?':e==='descartado'?'¿Por qué se descarta? (opcional)':'Nota'}">${esc(r.nota||'')}</textarea></div>`
         :`<button class="mas" data-nn="${esc(it.id)}">+ Nota</button>`)+`</div>`;}
  }
  $('#main').innerHTML=h; pintarEstado(); pintarPie();
  const m=$('#main');
  m.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.filtro=b.dataset.f;pintar();});
  m.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>marcar(l.id,b.dataset.i,b.dataset.m));
  m.querySelectorAll('[data-ab]').forEach(b=>b.onclick=()=>{S.abiertos[b.dataset.ab]=!S.abiertos[b.dataset.ab];pintar();});
  m.querySelectorAll('[data-nn]').forEach(b=>b.onclick=()=>{S.abiertos['n'+b.dataset.nn]=true;pintar();const t=m.querySelector(`[data-n="${CSS.escape(b.dataset.nn)}"]`);t&&t.focus();});
  m.querySelectorAll('[data-n]').forEach(t=>t.oninput=()=>nota(l.id,t.dataset.n,t.value));
  m.querySelectorAll('[data-ga]').forEach(b=>b.onclick=()=>{const g=b.dataset.ga;const Rr=resp[l.id]=resp[l.id]||{lista:l.id,items:{}};let n=0;
    for(const it of l.items)if((it.grupo||'')===g&&!(Rr.items[it.id]||{}).estado){Rr.items[it.id]={estado:'aprobado',nota:(Rr.items[it.id]||{}).nota||'',fecha:ahora()};n++;}
    if(n){programar(l.id);toast(n+' aprobados');}else toast('No había ítems sin marcar');pintar();});
  const qi=$('#q'); qi.oninput=()=>{S.q=qi.value;clearTimeout(qi._t);qi._t=setTimeout(()=>{const p=qi.selectionStart;pintar();const n=$('#q');n.focus();n.setSelectionRange(p,p);},350);};
}
function pintarPie(){if(S.vista!=='lista')return;const l=listas.find(x=>x.id===S.lista);if(!l)return;const c=cuenta(l);const ter=(resp[l.id]||{}).terminada;
  $('#pie').innerHTML=`<div class="cuenta"><b class="a">${c.aprobado}</b> aprobados · <b class="r">${c.revisar}</b> revisar · <b class="d">${c.descartado}</b> descartados<br>${c.sin} sin marcar${pendientes.has(l.id)?' · por enviar':' · enviado'}</div>`
   +`<button class="btn${ter?' sec':''}" id="ter">${ter?'Reabrir':'Terminé'}</button>`;
  $('#ter').onclick=()=>{const R=resp[l.id]=resp[l.id]||{lista:l.id,items:{}};
    if(!R.terminada&&c.sin&&!confirmarSuave(c.sin))return; R.terminada=!R.terminada;R.actualizado=ahora();programar(l.id);toast(R.terminada?'Lista terminada: Claude ya puede leerla':'Lista reabierta');S.vista=R.terminada?'inicio':'lista';pintar();};}
let avisoTer=0; function confirmarSuave(n){if(Date.now()-avisoTer<4000)return true;avisoTer=Date.now();toast('Quedan '+n+' sin marcar. Toca otra vez para terminar igual');return false;}
function pintarAjustes(){$('#titulo').textContent='Ajustes';$('#pie').hidden=true;
  $('#main').innerHTML=`<div class="estado" id="est"></div><div class="aviso">La app usa la misma llave de la Bitácora si ya la abriste en este navegador. Si no, pega aquí la llave "Bitacora celular" (solo para ${GH.repo}).</div>
  <label class="et">Llave de GitHub</label><input class="campo" id="tok" type="password" placeholder="${token?'Hay una llave guardada':'github_pat_…'}">
  <p><button class="btn" id="bTok">Guardar llave</button> <button class="btn sec" id="bBit">Usar la de la Bitácora</button></p>
  <p><button class="btn sec" id="bSync">Sincronizar ahora</button></p><p class="estado">Versión ${VERSION} · datos en ${GH.repo}/${GH.carpeta}</p>`;
  pintarEstado();
  $('#bTok').onclick=()=>{const v=$('#tok').value.trim();if(!v)return toast('Pega primero la llave');token=v;localStorage.setItem('apr_token',v);toast('Llave guardada');sincronizar();};
  $('#bBit').onclick=async()=>{const v=await llaveBitacora();if(!v)return toast('No encontré la llave de la Bitácora en este navegador');token=v;localStorage.setItem('apr_token',v);toast('Llave de la Bitácora lista');sincronizar();};
  $('#bSync').onclick=()=>sincronizar();}

$('#atras').onclick=()=>{S.vista='inicio';pintar();};
$('#aj').onclick=()=>{S.vista='ajustes';pintar();};
addEventListener('online',sincronizar);
